    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

<body>
    <header id="header">
        <div class="header-container">
            <div class="header-left">
                <div class="logo"><a href="/" class="logo-link">EastFever</a></div>
                <nav class="nav-menu">
                    <a href="/" class="nav-link" id="nav-home">Home</a>
                    <a href="/about/" class="nav-link" id="nav-about">About</a>
                    <a href="/blog.html" class="nav-link active" id="nav-blog">Dev Story</a>
                </nav>
                <a href="mailto:mysticodoi@gmail.com" class="header-email">mysticodoi@gmail.com</a>
            </div>
            <div class="lang-selector">
                <button id="lang-btn" class="lang-btn">
                    <span class="lang-icon">🌐</span>
                    <span id="current-lang">한국어</span>
                    <span class="arrow">▾</span>
                </button>
                <ul id="lang-dropdown" class="lang-dropdown hidden">
                    <li data-lang="ko">한국어</li>
                    <li data-lang="en">English</li>
                    <li data-lang="ja">日本語</li>
                </ul>
            </div>
        </div>
    </header>

    <main class="post-container">
        <article class="post-content">
            <div class="post-header-area">
                <nav class="breadcrumbs">
                    <a href="/">Home</a> <span class="breadcrumb-sep">&gt;</span> <a href="/blog.html">Dev Story</a> <span class="breadcrumb-sep">&gt;</span> <span id="breadcrumb-title">...</span>
                </nav>
                <span id="post-category" class="post-category">...</span>
                <h1 id="post-title" class="post-title">포스트를 불러오는 중...</h1>
                <div class="post-meta">
                    <span id="post-date" class="post-date"></span>
                </div>
            </div>

            <div id="post-body" class="markdown-body">
                <!-- 마크다운 렌더링 결과가 이곳에 삽입됩니다. -->
            </div>

            <div class="back-to-list">
                <a href="blog.html" class="back-link">
                    <span>←</span> 블로그 목록으로 돌아가기
                </a>
            </div>
        </article>
    </main>

    <footer id="footer">
        <div class="footer-container">
            <div class="footer-links">
                <a href="/terms.html" class="footer-link-text" id="footer-terms">이용약관</a>
                <span class="footer-divider">|</span>
                <a href="/privacy.html" class="footer-link-text" id="footer-privacy">개인정보처리방침</a>
            </div>
            <p class="copyright">&copy; 2026 EastFever. All rights reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/data-loader.js?v=37"></script>
    <script src="js/i18n.js?v=38"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        function upsertJsonLdScript(id, data) {
            let script = document.getElementById(id);
            if (!script) {
                script = document.createElement('script');
                script.id = id;
                script.type = 'application/ld+json';
                document.head.appendChild(script);
            }

            script.textContent = JSON.stringify(data);
        }

        function updateBreadcrumbStructuredData(postInfo) {
            const postUrl = `https://eastfever.com/post.html?id=${encodeURIComponent(postInfo.id)}`;
            upsertJsonLdScript('breadcrumb-jsonld', {
                '@context': 'https://schema.org',
                '@type': 'BreadcrumbList',
                itemListElement: [
                    {
                        '@type': 'ListItem',
                        position: 1,
                        name: 'Home',
                        item: 'https://eastfever.com'
                    },
                    {
                        '@type': 'ListItem',
                        position: 2,
                        name: 'Dev Story',
                        item: 'https://eastfever.com/blog.html'
                    },
                    {
                        '@type': 'ListItem',
                        position: 3,
                        name: postInfo.title,
                        item: postUrl
                    }
                ]
            });
        }

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[char]);
        }

        function parseOgCardAttributes(value) {
            const attrs = {};
            const attrPattern = /([\w-]+)\s*=\s*"([^"]*)"|([\w-]+)\s*=\s*'([^']*)'/g;
            let match;

            while ((match = attrPattern.exec(value)) !== null) {
                attrs[match[1] || match[3]] = match[2] || match[4] || '';
            }

            return attrs;
        }

        function normalizeUrl(value) {
            try {
                const url = new URL(value, window.location.origin);
                return ['http:', 'https:'].includes(url.protocol) ? url : null;
            } catch (e) {
                return null;
            }
        }

        function getLocalizedValue(value, lang = 'ko') {
            if (!value) return '';
            if (typeof value === 'string') return value;
            return value[lang] || value.ko || '';
        }

        function findServiceByUrl(url, data) {
            if (!data || !Array.isArray(data.services)) return null;
            const target = url.replace(/\/$/, '');

            return data.services.find(service => {
                if (!service.url) return false;
                return service.url.replace(/\/$/, '') === target;
            });
        }

        function resolveImagePath(image) {
            if (!image) return '';
            if (/^https?:\/\//.test(image) || image.startsWith('/')) return image;
            return `/${image}`;
        }

        function resolveAbsoluteImageUrl(image) {
            if (!image) return 'https://eastfever.com/assets/og-image-final.webp?v=38';
            if (/^https?:\/\//.test(image)) return image;
            const path = image.startsWith('/') ? image : `/${image}`;
            return `https://eastfever.com${path}`;
        }

        function setMeta(kind, key, content) {
            if (!content) return;
            let meta = document.querySelector(`meta[${kind}="${key}"]`);
            if (!meta) {
                meta = document.createElement('meta');
                meta.setAttribute(kind, key);
                document.head.appendChild(meta);
            }
            meta.setAttribute('content', content);
        }

        function updatePostMetaTags(postInfo) {
            const title = `${postInfo.title} - EastFever`;
            const description = postInfo.summary;
            const url = `https://eastfever.com/post.html?id=${encodeURIComponent(postInfo.id)}`;
            const image = resolveAbsoluteImageUrl();

            document.title = title;
            setMeta('name', 'description', description);
            setMeta('property', 'og:type', 'article');
            setMeta('property', 'og:url', url);
            setMeta('property', 'og:title', title);
            setMeta('property', 'og:description', description);
            setMeta('property', 'og:image', image);
            setMeta('name', 'twitter:card', 'summary_large_image');
            setMeta('name', 'twitter:url', url);
            setMeta('name', 'twitter:title', title);
            setMeta('name', 'twitter:description', description);
            setMeta('name', 'twitter:image', image);
        }

        function renderOgCard(attrs, data) {
            const url = normalizeUrl(attrs.url);
            if (!url) return '';

            const service = findServiceByUrl(url.href, data);
            const title = attrs.title || getLocalizedValue(service && service.name) || url.hostname;
            const description = attrs.description || getLocalizedValue(service && service.description) || url.href;
            const image = resolveImagePath(attrs.image || (service && service.thumbnail));

            return `
<div class="og-card-wrap">
  <a class="og-card" href="${escapeHtml(url.href)}" target="_blank" rel="noopener noreferrer">
    ${image ? `<img class="og-card-image" src="${escapeHtml(image)}" alt="">` : ''}
    <span class="og-card-content">
      <strong class="og-card-title">${escapeHtml(title)}</strong>
      <span class="og-card-description">${escapeHtml(description)}</span>
      <span class="og-card-url">${escapeHtml(url.hostname)}</span>
    </span>
  </a>
</div>`;
        }

        function replaceOgCards(markdown, data) {
            return markdown.replace(/^::og-card\{([^}\n]+)\}\s*$/gm, (match, attrText) => {
                return renderOgCard(parseOgCardAttributes(attrText), data) || match;
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            // Initialize i18n
            const data = await window.dataLoader.load();
            if (data) window.efI18n.updateUI();

            const params = new URLSearchParams(window.location.search);
            const postId = params.get('id');

            if (!postId) {
                window.location.href = 'blog.html';
                return;
            }

            try {
                // 1. 메타데이터 로드
                const metaResponse = await fetch('data/posts.json');
                const metaData = await metaResponse.json();
                const postInfo = metaData.posts.find(p => p.id == postId);

                if (!postInfo) throw new Error('포스트 정보를 찾을 수 없습니다.');

                // 2. 제목 및 메타 설정 (SEO)
                updatePostMetaTags(postInfo);
                document.getElementById('breadcrumb-title').textContent = postInfo.title;
                document.getElementById('post-title').textContent = postInfo.title;
                document.getElementById('post-category').textContent = postInfo.category;
                document.getElementById('post-date').textContent = postInfo.date;
                updateBreadcrumbStructuredData(postInfo);

                // 3. 마크다운 파일 로드
                const contentResponse = await fetch(`posts/${postInfo.file}?v=${new Date().getTime()}`);
                if (!contentResponse.ok) throw new Error('콘텐츠 파일을 로드할 수 없습니다.');
                let markdown = await contentResponse.text();

                // Frontmatter 제거 (--- ... ---)
                markdown = markdown.replace(/^---[\s\S]*?---/, '').trim();

                // 본문 내 중복 제목 (# 제목) 제거 - 여러 줄에 걸친 공백 및 개행 고려
                markdown = markdown.replace(/^(\s*#\s+[^\r\n]*)/, '').trim();

                // 커스텀 OG 카드 문법(::og-card{...})을 HTML 링크 카드로 변환
                markdown = replaceOgCards(markdown, data);

                // 4. 렌더링
                const htmlContent = marked.parse(markdown);
                const postBody = document.getElementById('post-body');
                postBody.innerHTML = htmlContent;

                // 상단으로 스크롤
                window.scrollTo(0, 0);

            } catch (error) {
                console.error('Error loading post:', error);
                document.getElementById('post-title').textContent = '콘텐츠 로드 실패';
                document.getElementById('post-body').innerHTML = '<p>요청하신 포스트를 불러오는 중에 문제가 발생했습니다.</p>';
            }
        });
    </script>
</body>
</html>
